server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # MAX_UPLOAD_MB defaults to 5; leave headroom for the multipart envelope.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # API and OpenAPI docs (/api/docs). Keep the /api prefix: no trailing slash on proxy_pass.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build output can be cached forever.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /fridges/12, /report, /registry resolve to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
