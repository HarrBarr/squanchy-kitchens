<div class="aurora-line" aria-hidden="true"></div>
<mat-toolbar class="app-bar">
  <a routerLink="/" class="brand" aria-label="Squanchy Kitchens home">
    <span class="mark" aria-hidden="true"><mat-icon>kitchen</mat-icon></span>
    <span class="name">Squanchy <span class="aurora-text">Kitchens</span></span>
  </a>
  <span class="spacer"></span>
  <nav class="nav-wide" aria-label="Main">
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Dashboard</a
    >
    <a mat-button routerLink="/report" routerLinkActive="active">Inspector report</a>
    <a mat-button routerLink="/registry" routerLinkActive="active">Logger registry</a>
  </nav>
  <button
    mat-flat-button
    class="btn-cta upload-btn"
    (click)="openUpload()"
    aria-label="Upload a logger file"
  >
    <mat-icon>upload_file</mat-icon>
    <span class="upload-label">Upload</span>
  </button>
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>

<!-- Phone: bottom navigation, thumb-reachable -->
<nav class="nav-bottom" aria-label="Main">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <mat-icon>dashboard</mat-icon><span>Fridges</span>
  </a>
  <a routerLink="/report" routerLinkActive="active">
    <mat-icon>assignment</mat-icon><span>Report</span>
  </a>
  <a routerLink="/registry" routerLinkActive="active">
    <mat-icon>sensors</mat-icon><span>Registry</span>
  </a>
</nav>

@if (pageDrag()) {
  <div class="page-drop" aria-hidden="true">
    <div class="page-drop-box">
      <mat-icon>file_download</mat-icon>
      <strong>Drop a logger file to upload it</strong>
      <span>You'll confirm the logger before anything is imported.</span>
    </div>
  </div>
}
