[alembic]
script_location = alembic
# Import the app from the working directory (/app in the image, ./backend in dev mode), never
# from a possibly stale copy in site-packages.
prepend_sys_path = .
# The URL comes from app.config (DATABASE_URL), see alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
